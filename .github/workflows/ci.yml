name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test-site.mjs
      - run: node --test explorer/test-explorer.mjs
      - name: Test and build token module
        run: |
          npm ci --ignore-scripts --prefix token
          npm test --prefix token
          npm run build --prefix token
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix docs
      - run: npm test --prefix docs
      - run: npm run build --prefix docs
      - run: node docs/check-links.mjs
      # With docs/dist present, the site check also follows links into it.
      - run: node test-site.mjs
